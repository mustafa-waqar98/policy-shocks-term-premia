name: refresh data and dashboard

# Pulls the latest data, re-estimates everything and redeploys the site.
# Runs every weekday evening (US time) and can be started by hand from the Actions tab.
on:
  schedule:
    - cron: "17 23 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - run: tpshock all
      - uses: actions/upload-artifact@v4
        with:
          name: processed-data
          path: data/processed/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
